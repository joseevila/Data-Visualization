<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup Decision Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2333;--mut:#5d6778;--line:#e3e6eb;--acc:#2E5BBA;--accbg:#eaf0fb;--ok:#1e7b34;--okbg:#e6f4ea;--bad:#a32d2d;--badbg:#fcebeb;--warn:#7a5200;--warnbg:#fff4dc}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf0;--mut:#9aa3b2;--line:#2c3340;--acc:#7da2f0;--accbg:#22304a;--ok:#7fd49a;--okbg:#17321f;--bad:#f2a3a3;--badbg:#3a1d1d;--warn:#f1cf86;--warnbg:#3a2f17}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header{padding:16px 24px 8px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font-size:20px;font-weight:600;margin:0}
.small{font-size:12px;color:var(--mut)}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;border:1px solid var(--line);background:var(--card)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:none;color:var(--acc);cursor:pointer;padding:0;font-size:13px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;padding:4px 24px 10px;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;max-width:420px}
.chip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .x{color:var(--mut);cursor:pointer}
.tabs{display:flex;gap:4px;padding:0 24px}
.tabs button{border:none;background:none;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--mut);font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:12px 24px 32px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ctl{margin-bottom:12px}
.ctl>label.t,.t{display:block;font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
select,input[type=text],input[type=number],input[type=date],input[type=password],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
summary{padding:7px 10px;cursor:pointer;font-size:13px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
details .opts{padding:4px 10px 8px;max-height:180px;overflow:auto}
details .opts label{display:flex;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.badge{background:var(--accbg);color:var(--acc);border-radius:999px;padding:0 7px;font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--card)}
.kpi.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
.kpi .v{font-size:24px;font-weight:600;margin:4px 0}
.kpi .l{font-size:12.5px;color:var(--mut)}
.title{font-weight:600;font-size:15px}
.insight{font-size:14.5px;line-height:1.55;margin:6px 0 12px}
.chartbox{position:relative;height:400px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:600;color:var(--mut);font-size:12px;background:var(--card)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--accbg)}tr.row.on td{background:var(--accbg);font-weight:500}
.edited{border-bottom:2px dotted var(--acc)}
.sel{margin-top:12px;border:1px solid var(--acc);border-radius:10px;padding:12px;background:var(--accbg)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 16px;margin:10px 0}
.grid .f .k{font-size:11.5px;color:var(--mut)}.grid .f .val{font-weight:500}
.cell{border:1px solid var(--line);border-radius:10px;padding:10px}
.cell .k{font-size:11.5px;color:var(--mut)}.cell .val{font-size:17px;font-weight:600;margin:2px 0}
.cell button{margin-top:4px}
.audit li{margin:6px 0}
.note{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}.note.ok{background:var(--okbg);color:var(--ok)}
.modal-bg{display:none;min-height:100vh;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:720px;width:100%;padding:20px}
.modal h2{font-size:17px;margin:0 0 4px;font-weight:600}
pre.email{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;max-height:320px;overflow:auto}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
.kv div:nth-child(odd){color:var(--mut)}
.checks{list-style:none;padding:0}.checks li{padding:4px 0}.checks .y{color:var(--ok)}.checks .n{color:var(--bad)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div><h1>Startup Decision Maker</h1><div class="small" id="sub">Simulated data</div></div>
  <div class="row2" style="gap:8px"><span class="pill" id="server">Checking server…</span><button class="btn" id="unlock">Unlock actions</button></div>
</header>
<div class="ctx" id="ctx"></div>
<nav class="tabs" id="tabs"></nav>
<div class="wrap">
  <aside class="card" id="side"></aside>
  <main class="card" id="main"></main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>

<script type="module">
import * as M from './lib/metrics.js';
Chart.register(ChartDataLabels);
const PAL=['#2E5BBA','#E07B39','#2A9D8F','#C44569','#8E7DBE','#D4A72C','#5C6B73','#6AB04C','#D35400','#3D5A80','#B5838D','#4D908E'];
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VIEWS=[['overview','Overview'],['segment','Segment'],['record','Record']];
const TYPES=[['bar','Bars'],['hbar','Horizontal'],['line','Line'],['stacked','Stacked'],['table','Table']];
const SORTS=[['natural','Natural'],['desc','High → low'],['asc','Low → high']];

// ---------- state: one object, preserved across views and reloads ----------
const DEFAULT={view:'overview',ds:'startups',metric:'survival',group:'sector',split:'',type:'bar',sort:'desc',minN:0,topN:0,labels:true,filters:{},segment:null,record:null,page:0};
let S={...DEFAULT};
try{const h=location.hash.match(/^#v=(.+)$/);if(h)S={...DEFAULT,...JSON.parse(decodeURIComponent(h[1]))}}catch{}
try{if(!location.hash){const s=sessionStorage.getItem('sdm-state');if(s)S={...DEFAULT,...JSON.parse(s)}}}catch{}
function save(){const j=JSON.stringify(S);history.replaceState(null,'','#v='+encodeURIComponent(j));try{sessionStorage.setItem('sdm-state',j)}catch{}}
function set(patch){S={...S,...patch};sanitize();save();render()}

let BASE=null,DATA=null,SRV={ok:false},PASS='',chart=null,AUDIT=null;
try{PASS=sessionStorage.getItem('sdm-pass')||''}catch{}

function sanitize(){
  if(!M.DS[S.ds])S.ds='startups';
  const d=M.DS[S.ds];
  if(!d.metrics[S.metric])S.metric=Object.keys(d.metrics)[0];
  if(!d.dims[S.group])S.group=Object.keys(d.dims)[0];
  if(S.split&&!d.dims[S.split])S.split='';
  if(S.metric==='mix')S.split='primary_success_definition';
  if(S.split===S.group)S.split='';
  if(S.segment&&(S.segment.ds!==S.ds||S.segment.group!==S.group))S.segment=null;
  if(S.record&&M.recordIndex(S.record)<0)S.record=null;
}

// ---------- server ----------
async function api(path,{method='GET',body}={}){
  const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(PASS?{'x-dashboard-passcode':PASS}:{})},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch{}
  return{status:r.status,...j};
}
async function loadServer(){
  try{
    const c=await api('context');
    if(c.status!==200)throw new Error();
    SRV={ok:true,...c};
  }catch{SRV={ok:false}}
  if(SRV.ok&&SRV.dataset_version!==BASE.version)SRV.staleBundle=true;
  if(SRV.ok&&SRV.configured&&SRV.configured.storage){
    const e=await api('edits');
    if(e.status===200)DATA=M.applyEdits(BASE,e.edits);
  }
  serverPill();
}
function actionsReady(kind){
  if(!SRV.ok)return'The server is not reachable, so actions are read-only.';
  if(SRV.staleBundle)return'The page is on an older dataset than the server. Reload the page.';
  if(!SRV.configured.storage)return'Actions are off until these server settings are added: '+SRV.configured.missing.join(', ')+'.';
  if(!SRV.versions_match)return`Supabase is on dataset ${SRV.supabase_version||'(none)'} but this page is ${BASE.version}. Apply supabase/seed.sql first.`;
  if(kind==='email'&&!SRV.configured.email)return'Email is off until these server settings are added: '+SRV.configured.missing.join(', ')+'.';
  if(!SRV.authed)return'Unlock actions with the dashboard passcode first.';
  return null;
}
function serverPill(){
  const p=$('server');
  const blocker=actionsReady('email');
  if(!blocker){p.className='pill ok';p.textContent='Actions ready'}
  else if(SRV.ok&&!SRV.authed&&SRV.configured&&SRV.configured.storage&&SRV.versions_match){p.className='pill';p.textContent='Locked'}
  else{p.className='pill warn';p.textContent='Read-only';p.title=blocker}
  $('unlock').textContent=SRV.authed?'Lock':'Unlock actions';
}
$('unlock').onclick=()=>{
  if(SRV.authed){PASS='';try{sessionStorage.removeItem('sdm-pass')}catch{};loadServer().then(render);return}
  openModal(`<h2>Unlock actions</h2><p class="small">Sharing, assigning, editing and reporting need the dashboard passcode. It is checked on the server and kept only in this browser tab.</p>
    <input type="password" id="pc" placeholder="Passcode" autocomplete="current-password"><div id="pcerr"></div>
    <div class="row2" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pcgo">Unlock</button></div>`);
  const go=async()=>{PASS=$('pc').value;await loadServer();if(SRV.authed){try{sessionStorage.setItem('sdm-pass',PASS)}catch{};closeModal();render()}else{$('pcerr').innerHTML=`<div class="note bad">${SRV.ok?'Wrong passcode.':'Server not reachable.'}</div>`}};
  $('pcgo').onclick=go;$('pc').onkeydown=e=>{if(e.key==='Enter')go()};$('pc').focus();
};

// ---------- shell ----------
function render(){
  if(!DATA)return;
  $('sub').textContent=`Simulated data · dataset ${BASE.version} · ${BASE.counts.startups.toLocaleString()} startups · ${BASE.counts.decisions.toLocaleString()} decisions · ${BASE.counts.survey.toLocaleString()} survey responses`;
  $('tabs').innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>set({view:b.dataset.v}));
  renderContext();renderSide();
  if(chart){chart.destroy();chart=null}
  ({overview:renderOverview,segment:renderSegment,record:renderRecord})[S.view]();
}
function renderContext(){
  const d=M.DS[S.ds],m=d.metrics[S.metric];
  const nf=Object.values(S.filters).filter(v=>v&&v.length).length;
  const chips=[`<span class="chip" data-go="overview">Metric <b>${esc(m.label)}</b> <span class="small">${esc(d.label)}</span></span>`,
    `<span class="chip" data-go="segment">Filters <b>${nf?esc(M.describeFilters(S.ds,S.filters)):'none'}</b>${nf?'<span class="x" data-clear="filters">✕</span>':''}</span>`];
  if(S.segment)chips.push(`<span class="chip" data-go="segment">Segment <b>${esc(M.describeSegment(S.ds,S.segment))}</b><span class="x" data-clear="segment">✕</span></span>`);
  if(S.record)chips.push(`<span class="chip" data-go="record">Record <b>${esc(S.record)}</b><span class="x" data-clear="record">✕</span></span>`);
  $('ctx').innerHTML=chips.join('');
  $('ctx').querySelectorAll('[data-go]').forEach(c=>c.onclick=e=>{if(e.target.dataset.clear)return;set({view:c.dataset.go})});
  $('ctx').querySelectorAll('[data-clear]').forEach(x=>x.onclick=()=>set(x.dataset.clear==='filters'?{filters:{},segment:null,page:0}:{[x.dataset.clear]:null}));
}
function segBtns(items,val,key){return`<div class="seg">${items.map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${String(val)===String(v)?'on':''}">${l}</button>`).join('')}</div>`}
function renderSide(){
  const d=M.DS[S.ds];
  const dimOpts=(sel,none)=>(none?'<option value="">None</option>':'')+Object.entries(d.dims).map(([k,l])=>`<option value="${k}" ${sel===k?'selected':''}>${l}</option>`).join('');
  let h=`<div class="ctl"><label class="t">Dataset</label>${segBtns(Object.entries(M.DS).map(([k,v])=>[k,v.label]),S.ds,'ds')}</div>
    <div class="ctl"><label class="t" for="metric">Metric</label><select id="metric">${Object.entries(d.metrics).map(([k,m])=>`<option value="${k}" ${S.metric===k?'selected':''}>${m.label}</option>`).join('')}</select></div>`;
  if(S.view==='segment'){
    h+=`<div class="ctl"><label class="t" for="group">Group by</label><select id="group">${dimOpts(S.group)}</select></div>
      <div class="ctl"><label class="t" for="split">Split by</label><select id="split" ${S.metric==='mix'?'disabled':''}>${dimOpts(S.split,true)}</select>
        <button class="link" id="swap" style="margin-top:6px">Swap group and split</button></div>
      <div class="ctl"><label class="t">Chart</label>${segBtns(TYPES,S.type,'type')}</div>
      <div class="ctl"><label class="t">Sort</label>${segBtns(SORTS,S.sort,'sort')}</div>
      <div class="ctl"><label class="t" for="minN">Hide groups smaller than ${S.minN}</label><input type="range" id="minN" min="0" max="200" step="10" value="${S.minN}" style="width:100%"></div>
      <div class="ctl"><label class="small"><input type="checkbox" id="labels" ${S.labels?'checked':''}> Value labels</label></div>`;
  }
  h+=`<div class="ctl"><div class="row2"><label class="t" style="margin:0">Filters</label><button class="link" id="clearf">Clear</button></div><div id="filters" style="margin-top:6px"></div></div>`;
  $('side').innerHTML=h;
  $('side').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;
    if(k==='ds'){const dd=M.DS[v];set({ds:v,metric:dd.metrics[S.metric]?S.metric:Object.keys(dd.metrics)[0],group:dd.dims[S.group]?S.group:Object.keys(dd.dims)[0],segment:null,page:0})}else set({[k]:v})});
  $('metric').onchange=e=>set({metric:e.target.value});
  if(S.view==='segment'){
    $('group').onchange=e=>set({group:e.target.value,segment:null});
    $('split').onchange=e=>set({split:e.target.value,segment:null});
    $('swap').onclick=()=>{if(S.split)set({group:S.split,split:S.group,segment:null})};
    $('minN').onchange=e=>set({minN:+e.target.value});
    $('labels').onchange=e=>set({labels:e.target.checked});
  }
  $('clearf').onclick=()=>set({filters:{},segment:null,page:0});
  const box=$('filters');
  d.filters.forEach(dim=>{
    const vals=M.order(dim,[...new Set(DATA[S.ds].map(r=>r[dim]).filter(v=>v!=null))]);
    const sel=new Set(S.filters[dim]||[]);
    const det=document.createElement('details');
    det.innerHTML=`<summary><span>${d.dims[dim]}</span>${sel.size?`<span class="badge">${sel.size}</span>`:'<span class="small">All</span>'}</summary><div class="opts">${vals.map(v=>`<label><input type="checkbox" value="${esc(v)}" ${sel.has(String(v))?'checked':''}> ${esc(v)}</label>`).join('')}</div>`;
    det.querySelectorAll('input').forEach(i=>i.onchange=()=>{const cur=new Set(S.filters[dim]||[]);i.checked?cur.add(i.value):cur.delete(i.value);
      const f={...S.filters};if(cur.size)f[dim]=[...cur];else delete f[dim];set({filters:f,page:0,segment:S.segment&&S.segment.group===dim?null:S.segment})});
    box.appendChild(det);
  });
}

// ---------- Overview ----------
function renderOverview(){
  const cards=M.KPIS.map(([ds,met])=>{
    const seg=S.segment&&S.segment.ds===ds?S.segment:null;
    const k=M.kpi(DATA,ds,met,S.filters,seg);
    const on=S.ds===ds&&S.metric===met;
    const b=k.stat.den!=null?`${k.stat.num.toLocaleString()} of ${k.stat.den.toLocaleString()}`:`n = ${k.stat.n.toLocaleString()}`;
    return`<div class="kpi ${on?'on':''}" data-ds="${ds}" data-m="${met}"><div class="l">${esc(k.m.label)}</div><div class="v">${k.value}</div>
      <div class="small">${b}${seg?` · segment only`:''}</div>${on?`<button class="btn primary" style="margin-top:10px;width:100%" id="share">Share finding</button>`:''}</div>`;
  }).join('');
  const d=M.DS[S.ds],m=d.metrics[S.metric];
  $('main').innerHTML=`<div class="kpis">${cards}</div>
    <div class="title">${esc(m.label)} over time</div>
    <div class="small" style="margin:2px 0 10px">${esc(d.label)} by ${esc(d.dims[d.yearDim].toLowerCase())} · ${esc(M.describeFilters(S.ds,S.filters))}. Click a KPI card to select it; the selected one can be shared.</div>
    <div class="chartbox" style="height:300px"><canvas id="cv"></canvas></div>`;
  $('main').querySelectorAll('.kpi').forEach(c=>c.onclick=e=>{if(e.target.id==='share')return;const ds=c.dataset.ds;
    set({ds,metric:c.dataset.m,group:M.DS[ds].dims[S.group]?S.group:Object.keys(M.DS[ds].dims)[0],segment:S.segment&&S.segment.ds===ds?S.segment:null})});
  const sb=$('share');if(sb)sb.onclick=()=>openAction('share_finding');
  if(m.type==='mix')return;
  const r=M.compute(DATA,{...S,group:d.yearDim,split:'',sort:'natural',minN:0,topN:0});
  drawChart(r,'line',{noClick:true});
}

// ---------- Segment ----------
function renderSegment(){
  const r=M.compute(DATA,S);
  const{d,m,overall,cats,gt}=r;
  const valid=cats.filter(c=>gt.get(c).v!=null);
  let ins=`${esc(m.label)} across <b>${r.rows.length.toLocaleString()}</b> ${d.noun}: <b>${M.fmt(m,overall.v)}</b>${overall.den!=null?` (${overall.num.toLocaleString()} of ${overall.den.toLocaleString()})`:''}.`;
  if(valid.length>1&&!['count','sum','mix'].includes(m.type)){const s=[...valid].sort((a,b)=>gt.get(b).v-gt.get(a).v);ins+=` Highest <b>${esc(s[0])}</b> ${M.fmt(m,gt.get(s[0]).v)}, lowest <b>${esc(s.at(-1))}</b> ${M.fmt(m,gt.get(s.at(-1)).v)}.`}
  $('main').innerHTML=`<div class="title">${esc(m.label)} by ${esc(d.dims[S.group].toLowerCase())}${S.split?' and '+esc(d.dims[S.split].toLowerCase()):''}</div>
    <div class="insight">${ins}</div>
    <div class="chartbox" id="cb"><canvas id="cv"></canvas></div><div id="grid"></div>
    <div class="small" style="margin-top:8px">${m.note?esc(m.note)+' ':''}Click a bar to select that segment.</div><div id="selbox"></div>`;
  if(S.type==='table'){$('cb').classList.add('hide');renderTable(r)}else drawChart(r,S.type);
  renderSelection(r);
}
function renderTable(r){
  const{m,cats,series}=r;
  $('grid').innerHTML=`<table><thead><tr><th>${esc(M.DS[S.ds].dims[S.group])}</th>${series.map(s=>`<th>${esc(s.name)}</th>`).join('')}<th>n</th></tr></thead><tbody>
    ${cats.map((c,i)=>`<tr class="row ${S.segment&&S.segment.value===String(c)?'on':''}" data-c="${esc(c)}"><td>${esc(c)}</td>${series.map(s=>`<td>${s.stats[i].small?'–':M.fmt(m,s.stats[i].v)}</td>`).join('')}<td class="small">${(r.gt.get(c).n||0).toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
  $('grid').querySelectorAll('tr.row').forEach(t=>t.onclick=()=>set({segment:{ds:S.ds,group:S.group,value:t.dataset.c}}));
}
function renderSelection(r){
  if(!S.segment){$('selbox').innerHTML='';return}
  const k=M.kpi(DATA,S.ds,S.metric,S.filters,S.segment);
  const gap=k.stat.v!=null&&k.all.v!=null?k.stat.v-k.all.v:null;
  const recs=M.recordsFor(DATA,S).length;
  $('selbox').innerHTML=`<div class="sel"><div class="row2"><div><b>${esc(M.describeSegment(S.ds,S.segment))}</b><div class="small">${esc(k.m.label)}: ${k.value}${k.stat.den!=null?` (${k.stat.num} of ${k.stat.den})`:''} · all filtered ${M.fmt(k.m,k.all.v)}${gap!=null?` · gap ${M.isPct(k.m)?(gap>=0?'+':'')+(gap*100).toFixed(1)+' pts':(gap>=0?'+':'')+gap.toFixed(1)}`:''}</div></div>
    <div class="row2" style="gap:6px"><button class="btn" id="openrec" ${recs?'':'disabled'}>Open records (${recs.toLocaleString()})</button><button class="btn primary" id="assign">Assign investigation</button><button class="link" id="clrseg">Clear</button></div></div></div>`;
  $('openrec').onclick=()=>set({view:'record',page:0});
  $('assign').onclick=()=>openAction('assign_investigation');
  $('clrseg').onclick=()=>set({segment:null});
}
function drawChart(r,type,opt={}){
  const{m,cats,series,overall}=r;
  const horiz=type==='hbar',stacked=type==='stacked'||(m.type==='mix'&&type!=='line'),single=series.length===1;
  const ink=getComputedStyle(document.body).color,line=getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#ddd';
  const pv=v=>v==null?null:(M.isPct(m)?+(v*100).toFixed(2):+v.toFixed(2));
  const selIdx=S.segment&&S.segment.group===S.group?cats.findIndex(c=>String(c)===S.segment.value):-1;
  const datasets=series.map((s,i)=>{const c=single?PAL[0]:PAL[i%PAL.length];
    const col=cats.map((_,j)=>selIdx<0||j===selIdx||(S.segment.split&&s.name!==S.segment.splitValue&&false)?c:c+'55');
    return{label:s.name,data:s.stats.map(x=>pv(x.v)),_stats:s.stats,backgroundColor:type==='line'?c:col,borderColor:c,borderWidth:type==='line'?2.5:0,borderRadius:type==='line'?0:4,tension:.25,pointRadius:type==='line'?4:0,spanGaps:true,type:type==='line'?'line':'bar'}});
  if(!stacked&&!['mix','count','sum'].includes(m.type)&&overall.v!=null&&type!=='line'&&!horiz)
    datasets.push({label:'All filtered',type:'line',data:cats.map(()=>pv(overall.v)),borderColor:'#888',borderDash:[6,5],borderWidth:1.5,pointRadius:0,_stats:cats.map(()=>overall),datalabels:{display:false}});
  const va={beginAtZero:true,ticks:{color:ink,callback:v=>M.isPct(m)?v+'%':v},grid:{color:line}};if(m.type==='mix'&&stacked)va.max=100;
  chart=new Chart($('cv'),{type:'bar',data:{labels:cats,datasets},options:{responsive:true,maintainAspectRatio:false,indexAxis:horiz?'y':'x',animation:{duration:300},
    plugins:{legend:{display:!single||datasets.length>1,position:'bottom',labels:{color:ink,boxWidth:12}},
      tooltip:{callbacks:{label:c=>{const st=c.dataset._stats[c.dataIndex];let t=`${c.dataset.label}: ${M.fmt(m,st.v)}`;if(st.den!=null)t+=` (${st.num} / ${st.den})`;else if(st.n!=null)t+=` (n = ${st.n})`;return t}}},
      datalabels:{display:ctx=>{if(!S.labels)return false;const v=ctx.dataset.data[ctx.dataIndex];if(v==null)return false;return stacked?(M.isPct(m)?v>=6:true):series.length<=3&&cats.length<=14},
        color:stacked?'#fff':ink,anchor:stacked?'center':'end',align:stacked?'center':(horiz?'right':'top'),font:{size:11,weight:'500'},formatter:v=>M.isPct(m)?v.toFixed(stacked?0:1)+'%':(m.type==='count'?Math.round(v).toLocaleString():v.toFixed(1))}},
    scales:{x:{stacked,ticks:{color:ink},grid:{color:horiz?line:'transparent'},...(horiz?va:{})},y:{stacked,ticks:{color:ink},grid:{color:horiz?'transparent':line},...(horiz?{}:va)}},
    onClick:(e,els)=>{if(opt.noClick||!els.length)return;const el=els[0],ds=chart.data.datasets[el.datasetIndex];if(ds.label==='All filtered')return;
      const seg={ds:S.ds,group:S.group,value:String(cats[el.index])};if(series.length>1){seg.split=S.split;seg.splitValue=ds.label}set({segment:seg})}}});
}

// ---------- Record ----------
const COLS=[['sector','Sector'],['stage','Stage'],['funding_type','Funding'],['outcome_36m','Outcome']];
function renderRecord(){
  if(S.ds==='survey'){$('main').innerHTML=`<div class="note warn">Survey respondents are anonymous, so there are no startup records behind them. Switch the dataset to Startups or Decisions.</div>`;return}
  const rows=M.recordsFor(DATA,S);
  const per=25,pages=Math.max(1,Math.ceil(rows.length/per)),page=Math.min(S.page||0,pages-1);
  const slice=rows.slice(page*per,page*per+per);
  const ed=Object.keys(BASE.editable);
  const cell=(r,f)=>`<td class="${r._edits&&r._edits[f]?'edited':''}" title="${r._edits&&r._edits[f]?'Edited':''}">${M.fmtField(DATA,f,r[f])}</td>`;
  $('main').innerHTML=`<div class="row2"><div><div class="title">Records</div><div class="small">${rows.length.toLocaleString()} startups · ${esc(M.describeFilters(S.ds,S.filters))}${S.segment?' · '+esc(M.describeSegment(S.ds,S.segment)):''}</div></div>
    <div class="row2" style="gap:6px"><button class="btn" id="prev" ${page?'':'disabled'}>‹</button><span class="small">${page+1} / ${pages}</span><button class="btn" id="next" ${page<pages-1?'':'disabled'}>›</button></div></div>
    <div style="overflow:auto;margin-top:8px"><table><thead><tr><th>Record</th>${COLS.map(([,l])=>`<th class="l">${l}</th>`).join('')}<th>Runway</th><th>Revenue / mo</th><th>PMF</th></tr></thead><tbody>
    ${slice.map(r=>`<tr class="row ${S.record===r.id?'on':''}" data-id="${r.id}"><td>${r.id}</td>${COLS.map(([k])=>`<td class="l">${esc(r[k])}</td>`).join('')}${cell(r,'runway_months')}${cell(r,'mrr_usd')}${cell(r,'pmf_score_pct')}</tr>`).join('')}</tbody></table></div>
    <div id="detail"></div>`;
  $('prev').onclick=()=>set({page:page-1});$('next').onclick=()=>set({page:page+1});
  $('main').querySelectorAll('tr.row').forEach(t=>t.onclick=()=>set({record:t.dataset.id}));
  if(S.record)renderDetail(rows.some(r=>r.id===S.record));
}
async function renderDetail(inView){
  const r=DATA.startups[M.recordIndex(S.record)];
  const decs=DATA.decisions.filter(x=>x.startup_id===r.id);
  const prof=[['Sector','sector'],['Stage','stage'],['Funding type','funding_type'],['Region','region'],['Founded','founded_year'],['Founder age band','founder_age_band'],['Prior founder outcome','prior_founder_outcome'],['Recommended fix','recommended_fix'],['Pivot signal','pivot_signal'],['Raise readiness','raise_readiness'],['36-month outcome','outcome_36m'],['Team size','team_size']];
  const box=$('detail');
  box.innerHTML=`<div class="sel" style="background:var(--card);border-color:var(--line)">
    <div class="row2"><div class="title">${r.id}</div><div class="row2" style="gap:6px"><button class="btn" id="rep">Report data issue</button><button class="link" id="close">Close</button></div></div>
    ${inView?'':'<div class="note warn">This record is outside the current filters or segment. It stays selected so you can keep working on it.</div>'}
    <div class="grid">${prof.map(([l,k])=>`<div class="f"><div class="k">${l}</div><div class="val">${esc(r[k]??'–')}</div></div>`).join('')}</div>
    <div class="t" style="margin-top:12px">Editable values</div>
    <div class="grid">${Object.entries(BASE.editable).map(([f,def])=>`<div class="cell" data-f="${f}"><div class="k">${esc(def.label)}${r._edits&&r._edits[f]?' · <span class="badge">edited</span>':''}</div>
      <div class="val">${M.fmtField(DATA,f,r[f])}</div><button class="link" data-edit="${f}">Edit</button></div>`).join('')}</div>
    <div class="t" style="margin-top:12px">Decisions (${decs.length})</div>
    <table><thead><tr><th class="l">Date</th><th class="l">Question</th><th class="l">Chose</th><th class="l">Evidence</th><th class="l">After 12 months</th></tr></thead><tbody>
    ${decs.map(x=>`<tr><td class="l">${x.decision_year}</td><td class="l">${esc(x.decision_type)}</td><td class="l">${esc(x.option_chosen)}</td><td class="l">${esc(x.evidence_basis)}</td><td class="l">${esc(x.outcome_12m)}</td></tr>`).join('')}</tbody></table>
    <div class="t" style="margin-top:14px">Audit trail</div><div id="audit" class="small">Loading…</div></div>`;
  $('close').onclick=()=>set({record:null});
  $('rep').onclick=()=>openAction('report_issue',{record_id:r.id});
  box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editCell(r,b.dataset.edit));
  if(!(SRV.ok&&SRV.configured&&SRV.configured.storage)){$('audit').textContent='Audit trail is available once the server is configured.';return}
  const a=await api('edits?record_id='+r.id);
  if(S.record!==r.id||!$('audit'))return;
  if(a.status!==200){$('audit').textContent=a.error||'Could not load the audit trail.';return}
  AUDIT=a;
  const lbl=f=>BASE.editable[f]?BASE.editable[f].label:f;
  $('audit').innerHTML=(a.history.length?`<ul class="audit">${a.history.map(h=>`<li>#${h.id} · ${h.created_at.slice(0,16).replace('T',' ')} · <b>${esc(lbl(h.field))}</b> ${M.fmtField(DATA,h.field,h.old_value)} → ${M.fmtField(DATA,h.field,h.new_value)} · "${esc(h.reason)}" <button class="link" data-audit="${h.id}">Report issue</button></li>`).join('')}</ul>`:'No edits yet.')
    +(a.issues.length?`<div class="t" style="margin-top:10px">Reported issues</div><ul class="audit">${a.issues.map(i=>`<li>#${i.id} · ${i.severity} · ${esc(i.description)}${i.audit_edit_id?` (on edit #${i.audit_edit_id})`:''}</li>`).join('')}</ul>`:'');
  $('audit').querySelectorAll('[data-audit]').forEach(b=>b.onclick=()=>openAction('report_issue',{record_id:r.id,audit_edit_id:Number(b.dataset.audit)}));
}
function editCell(r,f){
  const def=BASE.editable[f],cell=document.querySelector(`.cell[data-f="${f}"]`);
  cell.innerHTML=`<div class="k">${esc(def.label)} (${def.min}–${def.max} ${def.unit})</div>
    <input type="number" step="any" id="nv" value="${r[f]??''}" min="${def.min}" max="${def.max}">
    <input type="text" id="why" placeholder="Reason (required)" style="margin-top:6px"><div id="everr"></div>
    <div class="row2" style="margin-top:6px"><button class="link" id="cancel">Cancel</button><button class="btn primary" id="review">Review change</button></div>`;
  $('nv').focus();
  $('cancel').onclick=render;
  $('review').onclick=()=>{
    const nv=$('nv').value,why=$('why').value.trim();
    const err=nv===''||!Number.isFinite(+nv)?'Enter a number.':(+nv<def.min||+nv>def.max)?`Must be between ${def.min} and ${def.max}.`:why.length<3?'Add a reason (3+ characters).':(+nv===r[f])?'Same as the current value.':null;
    if(err){$('everr').innerHTML=`<div class="note bad">${err}</div>`;return}
    openAction('edit_record',{record_id:r.id,field:f,new_value:+nv,reason:why,expected_old:r[f]});
  };
}

// ---------- actions: compose → exact preview → confirm → verify ----------
function openModal(html){$('modal').innerHTML=html;$('mbg').classList.add('show');$('modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){$('mbg').classList.remove('show')}
$('mbg').onclick=e=>{if(e.target.id==='mbg')closeModal()};
const TITLES={share_finding:'Share finding',assign_investigation:'Assign investigation',edit_record:'Edit record value',report_issue:'Report data issue'};
function defaults(action,extra){
  const d=M.DS[S.ds],k=M.kpi(DATA,S.ds,S.metric,S.filters,S.segment&&S.segment.ds===S.ds?S.segment:null);
  if(action==='share_finding')return{subject:`Finding: ${k.m.label} is ${k.value}`,note:`${k.m.label} is ${k.value} for ${S.segment?M.describeSegment(S.ds,S.segment):'the current view'}. Details below.`};
  if(action==='assign_investigation'){const due=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
    return{subject:`Please investigate: ${M.describeSegment(S.ds,S.segment)}`,note:`Can you look into why ${M.describeSegment(S.ds,S.segment)} sits at ${k.value} on ${k.m.label.toLowerCase()}? Numbers below.`,due}}
  if(action==='report_issue')return{subject:`Data issue on ${extra.record_id}${extra.audit_edit_id?` (edit #${extra.audit_edit_id})`:''}`,note:'',to:SRV.data_owner||''};
  return{};
}
let ACT=null;
function openAction(action,extra={}){
  const blocker=actionsReady(action==='edit_record'?'storage':'email');
  if(blocker){openModal(`<h2>${TITLES[action]}</h2><div class="note warn">${esc(blocker)}</div><div class="row2" style="justify-content:flex-end"><button class="btn" data-close>Close</button>${!SRV.authed&&SRV.ok?'<button class="btn primary" id="gou">Unlock</button>':''}</div>`);
    const g=$('gou');if(g)g.onclick=()=>{closeModal();$('unlock').click()};return}
  const snap=JSON.parse(JSON.stringify(S));
  ACT={action,extra,state:snap,form:{...defaults(action,extra),...(ACT&&ACT.action===action&&ACT.keep?ACT.form:{})}};
  action==='edit_record'?preview():compose();
}
function compose(){
  const{action,form}=ACT,email=action!=='edit_record';
  const recips=(SRV.recipients||[]).filter(x=>!x.startsWith('@'));
  openModal(`<h2>${TITLES[action]}</h2><div class="small" style="margin-bottom:10px">${esc(contextLine())}</div>
    ${email?`<div class="ctl"><label class="t" for="to">${action==='assign_investigation'?'Assign to (email)':'To'}</label><input type="text" id="to" list="rl" value="${esc(form.to||'')}" placeholder="name@company.com, other@company.com">
      <datalist id="rl">${recips.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="small">Allowed: ${esc((SRV.recipients||[]).join(', ')||'set ALLOWED_RECIPIENTS on the server')}</div></div>`:''}
    ${action==='assign_investigation'?`<div class="ctl"><label class="t" for="due">Due date</label><input type="date" id="due" value="${esc(form.due||'')}"></div>`:''}
    ${action==='report_issue'?`<div class="ctl"><label class="t" for="sev">Severity</label><select id="sev">${['low','medium','high'].map(s=>`<option ${form.severity===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="ctl"><label class="t" for="desc">What is wrong</label><textarea id="desc" placeholder="Describe the issue">${esc(form.description||'')}</textarea></div>`:''}
    ${email?`<div class="ctl"><label class="t" for="subj">Subject</label><input type="text" id="subj" value="${esc(form.subject||'')}"></div>
      <div class="ctl"><label class="t" for="note">Message</label><textarea id="note">${esc(form.note||'')}</textarea><div class="small">The numbers are added by the server from the live data, so they always match the dashboard.</div></div>`:''}
    <div id="aerr"></div><div class="row2" style="justify-content:flex-end;margin-top:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pv">Preview</button></div>`);
  $('pv').onclick=()=>{
    const v=id=>$(id)?$(id).value:undefined;
    Object.assign(ACT.form,{to:v('to'),subject:v('subj'),note:v('note'),due:v('due'),severity:v('sev'),description:v('desc')});
    preview();
  };
}
function contextLine(){
  const s=ACT.state,x=ACT.extra;
  if(ACT.action==='share_finding')return`Selected KPI: ${M.DS[s.ds].metrics[s.metric].label} · ${M.describeFilters(s.ds,s.filters)}${s.segment&&s.segment.ds===s.ds?' · '+M.describeSegment(s.ds,s.segment):''}`;
  if(ACT.action==='assign_investigation')return`Selected bar: ${M.describeSegment(s.ds,s.segment)} · ${M.DS[s.ds].metrics[s.metric].label}`;
  if(ACT.action==='report_issue')return`Record ${x.record_id}${x.audit_edit_id?` · audit entry #${x.audit_edit_id}`:''}`;
  return`Record ${x.record_id} · ${BASE.editable[x.field].label}`;
}
function payload(){
  const f=ACT.form,x=ACT.extra;
  const p={action:ACT.action,dataset_version:BASE.version,state:ACT.state,...x};
  if(ACT.action!=='edit_record')p.message={to:(f.to||'').split(/[,;\s]+/).filter(Boolean),subject:f.subject||'',note:f.note||''};
  if(ACT.action==='assign_investigation')p.due=f.due;
  if(ACT.action==='report_issue'){p.severity=f.severity||'low';p.description=f.description||''}
  return p;
}
async function preview(){
  openModal(`<h2>${TITLES[ACT.action]}</h2><div class="small">Preparing the exact preview…</div>`);
  const r=await api('preview',{method:'POST',body:payload()});
  if(r.status!==200)return failed(r,true);
  ACT.hash=r.preview_hash;showPreview(r.preview);
}
function showPreview(pv,warn){
  const e=pv.email,c=pv.change;
  openModal(`<h2>${TITLES[ACT.action]} — preview</h2><div class="small" style="margin-bottom:8px">${esc(contextLine())}</div>
    ${warn?`<div class="note warn">${esc(warn)}</div>`:''}
    ${c?`<div class="kv"><div>Record</div><div><b>${c.record}</b></div><div>Field</div><div>${esc(c.field)}</div><div>Change</div><div><b>${esc(c.from)} → ${esc(c.to)}</b></div><div>Reason</div><div>${esc(c.reason)}</div>${c.impact?`<div>Effect</div><div>${esc(c.impact)}</div>`:''}</div>
      <div class="small">This is saved to the audit trail with your reason. It does not send email.</div>`:''}
    ${e?`<div class="kv"><div>From</div><div>${esc(e.from)}</div><div>To</div><div>${esc(e.to.join(', '))}</div><div>Subject</div><div><b>${esc(e.subject)}</b></div></div>
      <pre class="email">${esc(e.text)}</pre><div class="small">This is exactly what will be sent.</div>`:''}
    <div id="aerr"></div><div class="row2" style="justify-content:flex-end;margin-top:12px;gap:8px"><button class="btn" id="back">Back to edit</button>
      <button class="btn primary" id="go">${ACT.action==='edit_record'?'Save edit':ACT.action==='report_issue'?'Save and send':'Send email'}</button></div>`);
  $('back').onclick=()=>{if(ACT.action==='edit_record'){closeModal();editCell(DATA.startups[M.recordIndex(ACT.extra.record_id)],ACT.extra.field);$('nv').value=ACT.extra.new_value;$('why').value=ACT.extra.reason}else compose()};
  $('go').onclick=commit;
}
async function commit(){
  $('go').disabled=true;$('go').textContent='Working…';
  const r=await api('commit',{method:'POST',body:{...payload(),preview_hash:ACT.hash,confirm:true}});
  if(r.status===409&&r.preview_hash){ACT.hash=r.preview_hash;return showPreview(r.preview,r.error)}
  if(r.status!==200)return failed(r,false);
  if(['edit_record','report_issue'].includes(ACT.action)){const e=await api('edits');if(e.status===200)DATA=M.applyEdits(BASE,e.edits)}
  openModal(`<h2>${TITLES[ACT.action]} — done</h2><ul class="checks">${r.checks.map(c=>`<li class="${c.ok?'y':'n'}">${c.ok?'✓':'✗'} ${esc(c.label)}</li>`).join('')}</ul>
    ${r.to?`<div class="small">Sent to ${esc(r.to.join(', '))}.</div>`:''}<div class="row2" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" data-close>Done</button></div>`);
  ACT=null;render();
}
function failed(r,fromPreview){
  const box=$('aerr')||$('modal');
  const html=`<div class="note bad">${esc(r.error||'Something went wrong.')}</div>${r.checks?`<ul class="checks">${r.checks.map(c=>`<li class="${c.ok?'y':'n'}">${c.ok?'✓':'✗'} ${esc(c.label)}</li>`).join('')}</ul>`:''}
    ${r.reload?'<button class="btn primary" onclick="location.reload()">Reload</button>':''}`;
  if($('aerr'))$('aerr').innerHTML=html;
  else openModal(`<h2>${TITLES[ACT.action]}</h2>${html}<div class="row2" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="back2">Back to edit</button></div>`);
  const b=$('back2');if(b)b.onclick=()=>{ACT.action==='edit_record'?closeModal():compose()};
  if($('go')){$('go').disabled=false;$('go').textContent='Try again'}
}

// ---------- boot ----------
fetch('data.json').then(r=>r.json()).then(async j=>{
  BASE=M.loadData(j);DATA=BASE;sanitize();
  await loadServer();render();
}).catch(e=>{$('main').innerHTML=`<div class="note bad">Could not load data.json: ${esc(e)}</div>`});
</script>
</body>
