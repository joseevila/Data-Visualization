<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup Decision Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2333;--mut:#5d6778;--line:#e3e6eb;--acc:#2E5BBA;--accbg:#eaf0fb;--warn:#fff4dc;--warnink:#7a5200}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf0;--mut:#9aa3b2;--line:#2c3340;--acc:#7da2f0;--accbg:#22304a;--warn:#3a2f17;--warnink:#f1cf86}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{padding:18px 24px 10px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;font-weight:600;margin:0}
.presets{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px 4px}
.presets button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}
.presets button:hover,.presets button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:12px 24px 24px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ctl{margin-bottom:14px}
.ctl label.t{display:block;font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
select,input[type=range]{width:100%}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:6px;align-items:center}
.small{font-size:12px;color:var(--mut)}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
summary{padding:7px 10px;cursor:pointer;font-size:13px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
details .opts{padding:4px 10px 8px;max-height:180px;overflow:auto}
details .opts label{display:flex;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.badge{background:var(--accbg);color:var(--acc);border-radius:999px;padding:0 7px;font-size:11.5px}
.linkbtn{background:none;border:none;color:var(--acc);font:inherit;font-size:12.5px;cursor:pointer;padding:0}
.insight{font-size:14.5px;line-height:1.55;margin-bottom:12px}
.insight b{font-weight:600}
.chartbox{position:relative;height:440px}
#grid{overflow:auto;max-height:460px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mut);font-size:12px;position:sticky;top:0;background:var(--card)}
.drill{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:none}
.drill.show{display:block}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.kpi .v{font-size:18px;font-weight:600}
.kpi .l{font-size:11.5px;color:var(--mut)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.title{font-weight:600;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>Startup Decision Maker</h1>
  <span class="small">Simulated data · 3,000 startups · 6,000 decisions · 2,000 survey responses</span>
</header>

<div class="presets" id="presets"></div>

<div class="wrap">
  <aside class="card" id="controls">
    <div class="ctl"><label class="t">Dataset</label><div class="seg" id="dsSeg"></div></div>
    <div class="ctl"><label class="t" for="metric">Metric</label><select id="metric"></select></div>
    <div class="ctl"><label class="t" for="group">Group by</label><select id="group"></select></div>
    <div class="ctl"><label class="t" for="split">Split by</label><select id="split"></select>
      <div class="row" style="margin-top:6px"><button class="linkbtn" id="swap">Swap group and split</button></div></div>
    <div class="ctl"><label class="t">Chart</label><div class="seg" id="typeSeg"></div></div>
    <div class="ctl"><label class="t">Sort</label><div class="seg" id="sortSeg"></div></div>
    <div class="ctl"><label class="t" for="minN">Hide groups smaller than <span id="minNv"></span></label>
      <input type="range" id="minN" min="0" max="200" step="10"></div>
    <div class="ctl"><label class="t" for="topN">Show</label>
      <select id="topN"><option value="0">All groups</option><option value="5">Top 5</option><option value="8">Top 8</option><option value="10">Top 10</option></select></div>
    <div class="ctl"><label class="row small"><input type="checkbox" id="labels"> Value labels on chart</label>
      <label class="row small"><input type="checkbox" id="overallLine"> Overall reference line</label></div>
    <div class="ctl"><div class="row" style="justify-content:space-between"><label class="t" style="margin:0">Filters</label><button class="linkbtn" id="clear">Clear all</button></div>
      <div id="filters" style="margin-top:6px"></div></div>
  </aside>

  <main class="card">
    <div class="toolbar"><div class="title" id="title"></div><button class="linkbtn" id="copy">Copy view as text</button></div>
    <div class="insight" id="insight"></div>
    <div class="chartbox" id="chartbox"><canvas id="cv"></canvas></div>
    <div id="grid" style="display:none"></div>
    <div class="small" id="foot" style="margin-top:10px"></div>
    <div class="drill" id="drill"></div>
  </main>
</div>

<script>
Chart.register(ChartDataLabels);
const PAL=['#2E5BBA','#E07B39','#2A9D8F','#C44569','#8E7DBE','#D4A72C','#5C6B73','#6AB04C','#D35400','#3D5A80','#B5838D','#4D908E'];
const ORD={stage:['Idea','Pre-seed','Seed','Series A','Series B+'],founder_age_band:['Under 25','25-34','35-44','45-54','55+'],age_band:['18-24','25-34','35-44','45-54','55+'],
  choice_matched_signal:['Yes','Unclear','No'],survey_wave:['2025 wave','2026 wave'],raise_readiness:['Ready','Borderline','Not yet'],
  primary_success_definition:['Sustainable revenue','Business sale','Early exit','IPO'],prior_founder_outcome:['First-time','Previously failed','Previously succeeded']};
const DEFS=['Sustainable revenue','Business sale','Early exit','IPO'];

const DS={
 startups:{label:'Startups',
  dims:{sector:'Sector',stage:'Stage',funding_type:'Funding type',region:'Region',business_model:'Business model',founder_age_band:'Founder age',
    prior_founder_outcome:'Prior founder outcome',cofounder_relationship:'Co-founders',uses_hypothesis_testing:'Tests hypotheses',
    scaled_before_pmf:'Scaled before PMF',recommended_fix:'Recommended fix',pivot_signal:'Pivot signal',raise_readiness:'Raise readiness',founded_year:'Founded year'},
  filters:['sector','stage','funding_type','region','founded_year'],
  metrics:{
   survival:{label:'36-month survival rate',type:'rate',num:r=>r.survived_36m,elig:r=>r.survived_36m!=null},
   top10:{label:'Share reaching top 10%',type:'rate',num:r=>r.top10,elig:r=>r.top10!=null},
   runway:{label:'Median runway (months)',type:'median',val:r=>r.runway_months,unit:' mo'},
   pmf:{label:'Median PMF score (%)',type:'median',val:r=>r.pmf_score_pct,unit:'%'},
   ltv:{label:'Median LTV / CAC',type:'median',val:r=>r.ltv_cac_ratio,unit:'x'},
   growth:{label:'Average monthly growth (%)',type:'mean',val:r=>r.mom_growth_pct,unit:'%'},
   churn:{label:'Average monthly churn (%)',type:'mean',val:r=>r.monthly_churn_pct,unit:'%'},
   exp:{label:'Average industry experience (yrs)',type:'mean',val:r=>r.industry_experience_yrs,unit:' yrs'},
   count:{label:'Number of startups',type:'count'},
   funding:{label:'Total funding raised (USD M)',type:'sum',val:r=>r.funding_raised_usd/1e6,unit:'M'}}},
 decisions:{label:'Decisions',
  dims:{decision_type:'Decision type',evidence_basis:'Evidence used',choice_matched_signal:'Choice matched signal',option_chosen:'Option chosen',
    trigger:'Trigger',decision_year:'Decision year',sector:'Sector',stage:'Stage',funding_type:'Funding type',region:'Region',founder_age_band:'Founder age',round_sought:'Round sought'},
  filters:['decision_type','sector','stage','funding_type','decision_year'],
  metrics:{
   payoff:{label:'Decision pay-off rate',type:'rate',num:r=>r.decision_paid_off,elig:()=>true},
   raise:{label:'Raise close rate',type:'rate',num:r=>r.raise_closed,elig:r=>r.raise_attempt===1,note:'Only "Raise now" decisions count.'},
   mrr:{label:'Average revenue change after 12 months (%)',type:'mean',val:r=>r.mrr_change_12m_pct,unit:'%'},
   exps:{label:'Average experiments run before deciding',type:'mean',val:r=>r.experiments_run_before},
   count:{label:'Number of decisions',type:'count'}}},
 survey:{label:'Success survey',
  dims:{primary_success_definition:'Definition of success',survey_wave:'Survey wave',sector:'Sector',stage:'Stage',funding_type:'Funding type',
    region:'Region',age_band:'Age band',founder_type:'Founder type'},
  filters:['survey_wave','sector','stage','funding_type','region'],
  metrics:{
   mix:{label:'Definition mix (share of founders)',type:'mix'},
   ipo:{label:'Share choosing IPO',type:'rate',num:r=>r.primary_success_definition==='IPO'?1:0,elig:()=>true},
   rev:{label:'Share choosing sustainable revenue',type:'rate',num:r=>r.primary_success_definition==='Sustainable revenue'?1:0,elig:()=>true},
   sell:{label:'Would sell today for USD 10M',type:'rate',num:r=>r.would_sell,elig:r=>r.would_sell!=null},
   horizon:{label:'Average target horizon (years)',type:'mean',val:r=>r.target_horizon_years,unit:' yrs'},
   conf:{label:'Average confidence of reaching it (%)',type:'mean',val:r=>r.confidence_of_reaching_it_pct,unit:'%'},
   target:{label:'Median target value (USD M)',type:'median',val:r=>r.target_value_usd==null?null:r.target_value_usd/1e6,unit:'M'},
   count:{label:'Number of respondents',type:'count'}}}
};
const TYPES=[['bar','Bars'],['hbar','Horizontal'],['line','Line'],['stacked','Stacked'],['heatmap','Heatmap'],['table','Table']];
const SORTS=[['natural','Natural'],['desc','High → low'],['asc','Low → high']];
const PRESETS=[
 {label:'What do I fix?',s:{ds:'startups',metric:'survival',group:'recommended_fix',split:'',type:'hbar',sort:'desc'}},
 {label:'Pivot or persist?',s:{ds:'decisions',metric:'payoff',group:'evidence_basis',split:'choice_matched_signal',type:'bar',sort:'desc'},f:{decision_type:['Pivot or persist?']}},
 {label:'Am I ready to raise?',s:{ds:'decisions',metric:'raise',group:'decision_year',split:'',type:'line',sort:'natural'}},
 {label:'Does age matter?',s:{ds:'startups',metric:'top10',group:'founder_age_band',split:'',type:'bar',sort:'natural',overall:true}},
 {label:'What counts as success?',s:{ds:'survey',metric:'mix',group:'funding_type',split:'primary_success_definition',type:'stacked',sort:'natural'}},
 {label:'Survival heatmap',s:{ds:'startups',metric:'survival',group:'sector',split:'stage',type:'heatmap',sort:'desc',minN:20}}
];

let ROWS={},state={ds:'startups',metric:'survival',group:'sector',split:'',type:'bar',sort:'desc',minN:0,topN:0,labels:true,overall:true},F={startups:{},decisions:{},survey:{}},chart=null,last=null;
const $=id=>document.getElementById(id);

function decode(t){return t.rows.map(r=>{const o={};t.cats.forEach((c,i)=>o[c]=r[i]<0?null:t.dicts[c][r[i]]);t.nums.forEach((c,j)=>o[c]=r[t.cats.length+j]);return o})}

fetch('data.json').then(r=>r.json()).then(d=>{
  ROWS.startups=decode(d.S);ROWS.decisions=decode(d.D);ROWS.survey=decode(d.Q);
  buildStatic();syncControls();draw();
}).catch(e=>{$('insight').textContent='Could not load data.json: '+e});

function seg(el,items,key,onPick){el.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=v;b.onclick=()=>{onPick(v)};el.appendChild(b)})}
function markSeg(el,v){[...el.children].forEach(b=>b.classList.toggle('on',b.dataset.v===v))}

function buildStatic(){
  seg($('dsSeg'),Object.entries(DS).map(([k,v])=>[k,v.label]),'ds',v=>{const keep=state.ds===v;state.ds=v;if(!keep){const d=DS[v];state.metric=Object.keys(d.metrics)[0];state.group=Object.keys(d.dims)[0];state.split='';if(state.metric==='mix'){state.split='primary_success_definition';state.type='stacked'}}clearPreset();syncControls();draw()});
  seg($('typeSeg'),TYPES,'type',v=>{state.type=v;clearPreset();syncControls();draw()});
  seg($('sortSeg'),SORTS,'sort',v=>{state.sort=v;clearPreset();syncControls();draw()});
  const p=$('presets');PRESETS.forEach((pr,i)=>{const b=document.createElement('button');b.textContent=pr.label;b.onclick=()=>applyPreset(i);p.appendChild(b)});
  $('metric').onchange=e=>{state.metric=e.target.value;if(state.metric==='mix'){state.split='primary_success_definition';if(!['stacked','heatmap','table'].includes(state.type))state.type='stacked'}clearPreset();syncControls();draw()};
  $('group').onchange=e=>{state.group=e.target.value;if(state.split===state.group)state.split='';clearPreset();draw()};
  $('split').onchange=e=>{state.split=e.target.value;clearPreset();draw()};
  $('swap').onclick=()=>{if(!state.split)return;[state.group,state.split]=[state.split,state.group];clearPreset();syncControls();draw()};
  $('minN').oninput=e=>{state.minN=+e.target.value;$('minNv').textContent=state.minN;draw()};
  $('topN').onchange=e=>{state.topN=+e.target.value;draw()};
  $('labels').onchange=e=>{state.labels=e.target.checked;draw()};
  $('overallLine').onchange=e=>{state.overall=e.target.checked;draw()};
  $('clear').onclick=()=>{F[state.ds]={};clearPreset();buildFilters();draw()};
  $('copy').onclick=copyView;
}
function clearPreset(){[...$('presets').children].forEach(b=>b.classList.remove('on'))}
function applyPreset(i){
  const p=PRESETS[i];state=Object.assign(state,{split:'',minN:0,topN:0,overall:false},p.s);
  F[state.ds]={};if(p.f)for(const[k,v]of Object.entries(p.f))F[state.ds][k]=new Set(v);
  syncControls();draw();[...$('presets').children].forEach((b,j)=>b.classList.toggle('on',j===i));
}
function syncControls(){
  const d=DS[state.ds];
  markSeg($('dsSeg'),state.ds);markSeg($('typeSeg'),state.type);markSeg($('sortSeg'),state.sort);
  $('metric').innerHTML=Object.entries(d.metrics).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('');$('metric').value=state.metric;
  const dimOpts=Object.entries(d.dims).map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
  $('group').innerHTML=dimOpts;$('group').value=state.group;
  $('split').innerHTML='<option value="">None</option>'+dimOpts;$('split').value=state.split;
  $('split').disabled=state.metric==='mix';
  $('minN').value=state.minN;$('minNv').textContent=state.minN;$('topN').value=state.topN;
  $('labels').checked=state.labels;$('overallLine').checked=state.overall;
  buildFilters();
}
function buildFilters(){
  const d=DS[state.ds],box=$('filters');box.innerHTML='';
  d.filters.forEach(dim=>{
    const vals=order(dim,[...new Set(ROWS[state.ds].map(r=>r[dim]).filter(v=>v!=null))]);
    const sel=F[state.ds][dim]||new Set();
    const det=document.createElement('details');
    det.innerHTML=`<summary><span>${d.dims[dim]}</span>${sel.size?`<span class="badge">${sel.size}</span>`:'<span class="small">All</span>'}</summary><div class="opts"></div>`;
    const opts=det.querySelector('.opts');
    vals.forEach(v=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" ${sel.has(v)?'checked':''}> ${v}`;
      l.querySelector('input').onchange=e=>{const s=F[state.ds][dim]||new Set();e.target.checked?s.add(v):s.delete(v);F[state.ds][dim]=s;
        det.querySelector('summary').lastChild.outerHTML=s.size?`<span class="badge">${s.size}</span>`:'<span class="small">All</span>';clearPreset();draw()};
      opts.appendChild(l)});
    box.appendChild(det);
  });
}
function order(dim,vals){
  if(ORD[dim])return ORD[dim].filter(v=>vals.includes(v)).concat(vals.filter(v=>!ORD[dim].includes(v)).sort());
  return vals.sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
}
function filtered(){
  const f=F[state.ds];return ROWS[state.ds].filter(r=>Object.entries(f).every(([k,s])=>!s.size||s.has(r[k])));
}
function stat(list,m){
  if(m.type==='count'||m.type==='mix')return{v:list.length,n:list.length};
  if(m.type==='rate'){const e=list.filter(m.elig);const num=e.reduce((a,r)=>a+(m.num(r)||0),0);return{v:e.length?num/e.length:null,n:e.length,num,den:e.length,excluded:list.length-e.length}}
  const vals=list.map(m.val).filter(v=>v!=null&&!isNaN(v));
  if(m.type==='mean')return{v:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,n:vals.length};
  if(m.type==='sum')return{v:vals.reduce((a,b)=>a+b,0),n:list.length};
  vals.sort((a,b)=>a-b);const k=vals.length;return{v:k?(k%2?vals[(k-1)/2]:(vals[k/2-1]+vals[k/2])/2):null,n:k};
}
function groupBy(list,dim){const m=new Map();list.forEach(r=>{const k=r[dim]==null?'(blank)':r[dim];if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return m}

function compute(){
  const d=DS[state.ds],m=d.metrics[state.metric],rows=filtered();
  const overall=stat(rows,m);
  const g=groupBy(rows,state.group);
  let cats=order(state.group,[...g.keys()]);
  const gt=new Map(cats.map(c=>[c,stat(g.get(c),m)]));
  cats=cats.filter(c=>(gt.get(c).n||0)>=state.minN);
  const sortVal=c=>{const v=gt.get(c).v;return v==null?-Infinity:v};
  if(m.type==='mix'){/* sort by share choosing first split value */}
  if(state.sort==='desc')cats.sort((a,b)=>sortVal(b)-sortVal(a));
  if(state.sort==='asc')cats.sort((a,b)=>sortVal(a)-sortVal(b));
  if(state.topN)cats=cats.slice(0,state.topN);
  let series;
  if(!state.split){series=[{name:m.label,stats:cats.map(c=>gt.get(c))}]}
  else{
    const sv=order(state.split,[...new Set(rows.map(r=>r[state.split]==null?'(blank)':r[state.split]))]);
    series=sv.map(s=>({name:s,stats:cats.map(c=>{const sub=g.get(c).filter(r=>(r[state.split]==null?'(blank)':r[state.split])===s);
      if(m.type==='mix'){const tot=g.get(c).length;return{v:tot?sub.length/tot:null,n:sub.length,num:sub.length,den:tot}}
      const st=stat(sub,m);if(state.minN>0&&(st.n||0)<state.minN)return{v:null,n:st.n,small:true};return st})}));
  }
  return{d,m,rows,overall,cats,gt,series};
}
const isPct=m=>m.type==='rate'||m.type==='mix';
function fmt(m,v){if(v==null)return m.type==='rate'?'n/a':'–';if(isPct(m))return(v*100).toFixed(1)+'%';if(m.type==='count')return Math.round(v).toLocaleString();
  const u=m.unit||'';return(u==='M'?'USD '+v.toLocaleString(undefined,{maximumFractionDigits:1})+'M':v.toFixed(1)+u)}
function plotVal(m,v){return v==null?null:(isPct(m)?+(v*100).toFixed(2):+v.toFixed(2))}

function draw(){
  if(!ROWS.startups)return;
  const r=compute();last=r;const{d,m,overall,cats,series,gt}=r;
  $('title').textContent=`${m.label} by ${d.dims[state.group].toLowerCase()}${state.split?' and '+d.dims[state.split].toLowerCase():''}`;
  insight(r);foot(r);$('drill').classList.remove('show');
  const tabular=state.type==='heatmap'||state.type==='table';
  $('chartbox').style.display=tabular?'none':'block';$('grid').style.display=tabular?'block':'none';
  if(chart){chart.destroy();chart=null}
  if(tabular){renderGrid(r);return}
  const horiz=state.type==='hbar',stacked=state.type==='stacked'||m.type==='mix'&&state.type!=='line';
  const single=series.length===1;
  const datasets=series.map((s,i)=>{const c=single?PAL[0]:PAL[i%PAL.length];
    return{label:s.name,data:s.stats.map(st=>plotVal(m,st.v)),_stats:s.stats,backgroundColor:state.type==='line'?c:c+'D9',borderColor:c,borderWidth:state.type==='line'?2.5:0,
      borderRadius:state.type==='line'?0:4,tension:.25,pointRadius:state.type==='line'?4:0,spanGaps:true,
      type:state.type==='line'?'line':'bar',order:2}});
  if(state.overall&&overall.v!=null&&m.type!=='mix'&&m.type!=='count'&&m.type!=='sum'&&!stacked){
    datasets.push({label:'Overall',type:'line',data:cats.map(()=>plotVal(m,overall.v)),borderColor:'#888',borderDash:[6,5],borderWidth:1.5,pointRadius:0,order:1,datalabels:{display:false},_stats:cats.map(()=>overall),
      ...(horiz?{indexAxis:'y'}:{})});
  }
  const ink=getComputedStyle(document.body).color,line=getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#ddd';
  chart=new Chart($('cv'),{type:'bar',data:{labels:cats,datasets},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:horiz?'y':'x',animation:{duration:350},
      interaction:{mode:'nearest',intersect:true},
      plugins:{legend:{display:!single||datasets.length>1,position:'bottom',labels:{color:ink,boxWidth:12}},
        tooltip:{callbacks:{label:c=>{const st=c.dataset._stats[c.dataIndex];let t=`${c.dataset.label}: ${fmt(m,st.v)}`;
          if(st.den!=null)t+=`  (${st.num.toLocaleString()} / ${st.den.toLocaleString()})`;else if(st.n!=null)t+=`  (n = ${st.n.toLocaleString()})`;return t}}},
        datalabels:{display:ctx=>{if(!state.labels)return false;const v=ctx.dataset.data[ctx.dataIndex];if(v==null)return false;if(stacked)return isPct(m)?v>=6:true;return series.length<=3&&cats.length<=14},
          color:stacked?'#fff':ink,anchor:stacked?'center':'end',align:stacked?'center':(horiz?'right':'top'),font:{size:11,weight:'500'},
          formatter:v=>isPct(m)?v.toFixed(isPct(m)&&stacked?0:1)+'%':(m.type==='count'?Math.round(v).toLocaleString():v.toFixed(1))}},
      scales:{x:{stacked,ticks:{color:ink},grid:{color:horiz?line:'transparent'},...(horiz?valueAxis(m,stacked):{})},
              y:{stacked,ticks:{color:ink},grid:{color:horiz?'transparent':line},...(horiz?{}:valueAxis(m,stacked))}},
      onClick:(e,els)=>{if(!els.length)return;const el=els[0];const ds=chart.data.datasets[el.datasetIndex];if(ds.label==='Overall')return;showDrill(cats[el.index],series.length>1?ds.label:null)}}});
}
function valueAxis(m,stacked){const o={beginAtZero:true,ticks:{callback:v=>isPct(m)?v+'%':v}};if(m.type==='mix'&&stacked)o.max=100;else if(isPct(m))o.suggestedMax=Math.min(100,Math.ceil(((last.series.flatMap(s=>s.stats.map(x=>x.v||0)).reduce((a,b)=>Math.max(a,b),0))*100+8)/10)*10);return o}

function renderGrid(r){
  const{m,cats,series}=r,heat=state.type==='heatmap';
  const all=series.flatMap(s=>s.stats.map(x=>x.v)).filter(v=>v!=null);const lo=Math.min(...all),hi=Math.max(...all);
  const shade=v=>{if(v==null||!heat)return'';const t=hi>lo?(v-lo)/(hi-lo):.5;return`background:rgba(46,91,186,${(.08+t*.72).toFixed(2)});color:${t>.55?'#fff':'inherit'}`};
  let h=`<table><thead><tr><th>${DS[state.ds].dims[state.group]}</th>${series.map(s=>`<th>${s.name}</th>`).join('')}${series.length>1?'<th>All</th>':''}<th>n</th></tr></thead><tbody>`;
  cats.forEach((c,i)=>{const t=r.gt.get(c);h+=`<tr><td>${c}</td>${series.map(s=>{const st=s.stats[i];return`<td style="${shade(st.v)};cursor:pointer" data-c="${encodeURIComponent(c)}" data-s="${series.length>1?encodeURIComponent(s.name):''}" title="n = ${st.n??'–'}">${st.small?'<span class="small">n &lt; '+state.minN+'</span>':fmt(m,st.v)}</td>`}).join('')}${series.length>1&&m.type!=='mix'?`<td><b>${fmt(m,t.v)}</b></td>`:series.length>1?'<td>100%</td>':''}<td class="small">${(t.n??0).toLocaleString()}</td></tr>`});
  h+=`</tbody><tfoot><tr><td><b>All filtered</b></td>${series.map(()=>'<td></td>').join('')}${series.length>1?'<td></td>':''}<td class="small">${r.overall.n.toLocaleString()}</td></tr></tfoot></table>`;
  if(series.length===1)h=h.replace('<td></td><td class="small">'+r.overall.n.toLocaleString(),`<td><b>${fmt(m,r.overall.v)}</b></td><td class="small">${r.overall.n.toLocaleString()}`);
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('td[data-c]').forEach(td=>td.onclick=()=>showDrill(decodeURIComponent(td.dataset.c),td.dataset.s?decodeURIComponent(td.dataset.s):null));
}

function insight({d,m,overall,cats,gt,series}){
  const valid=cats.filter(c=>gt.get(c).v!=null);
  let t=`Across <b>${filtered().length.toLocaleString()}</b> ${d.label==='Success survey'?'respondents':d.label.toLowerCase()} in view, `;
  if(m.type==='mix'){
    const shares=DEFS.map(def=>[def,overall.n?filtered().filter(r=>r.primary_success_definition===def).length/overall.n:0]).sort((a,b)=>b[1]-a[1]);
    const lc=x=>x==='IPO'?x:x.toLowerCase();t+=`<b>${lc(shares[0][0])}</b> is the most common definition of success (${(shares[0][1]*100).toFixed(1)}%), and <b>${lc(shares[3][0])}</b> the least (${(shares[3][1]*100).toFixed(1)}%).`;
  } else {
    t+=`${m.label.charAt(0).toLowerCase()+m.label.slice(1)} is <b>${fmt(m,overall.v)}</b>`;
    if(overall.den!=null)t+=` (${overall.num.toLocaleString()} of ${overall.den.toLocaleString()})`;
    t+='.';
    if(valid.length>1&&m.type!=='count'&&m.type!=='sum'){
      const s=[...valid].sort((a,b)=>gt.get(b).v-gt.get(a).v),hi=s[0],lo=s[s.length-1];
      const gap=isPct(m)?((gt.get(hi).v-gt.get(lo).v)*100).toFixed(1)+' points':(gt.get(hi).v-gt.get(lo).v).toFixed(1)+(m.unit&&m.unit!=='M'?m.unit:'');
      t+=` Highest: <b>${hi}</b> at ${fmt(m,gt.get(hi).v)}; lowest: <b>${lo}</b> at ${fmt(m,gt.get(lo).v)}, a gap of ${gap}.`;
      const smallest=Math.min(...valid.map(c=>gt.get(c).n));
      if(smallest<30)t+=` <span class="small">Some groups have fewer than 30 rows, so treat their values with caution.</span>`;
    }
  }
  $('insight').innerHTML=t;
}
function foot({m,overall,d}){
  let t=[];
  if(state.ds==='startups'&&m.type==='rate'&&state.metric==='survival')t.push(`${(overall.excluded||0).toLocaleString()} startups excluded: their 36-month mark is after the Sept 2026 cut-off, so the outcome is not known yet.`);
  if(m.note)t.push(m.note);
  if(m.type==='rate')t.push('Rates are recomputed from numerator and denominator for every group, never averaged.');
  if(m.type==='median')t.push('Medians are recomputed from the rows in each group.');
  const nf=Object.values(F[state.ds]).filter(s=>s.size).length;if(nf)t.push(`${nf} filter${nf>1?'s':''} active.`);
  t.push('Click any bar or cell for detail.');
  $('foot').textContent=t.join(' ');
}
function showDrill(cat,splitVal){
  const{d,m,rows,overall}=last;
  let sub=rows.filter(r=>(r[state.group]==null?'(blank)':r[state.group])===cat);
  if(splitVal!=null)sub=sub.filter(r=>(r[state.split]==null?'(blank)':r[state.split])===splitVal);
  const st=stat(sub,m);const name=splitVal?`${cat} · ${splitVal}`:cat;
  const k=[];
  k.push([m.type==='mix'?'Share of group':m.label,m.type==='mix'?((sub.length/rows.filter(r=>(r[state.group]??'(blank)')===cat).length)*100).toFixed(1)+'%':fmt(m,st.v)]);
  if(st.den!=null)k.push(['Numerator / denominator',`${st.num.toLocaleString()} / ${st.den.toLocaleString()}`]);
  k.push(['Rows in group',sub.length.toLocaleString()]);
  if(m.type!=='mix'&&m.type!=='count'&&m.type!=='sum'&&overall.v!=null&&st.v!=null){const diff=st.v-overall.v;k.push(['vs all in view',(diff>=0?'+':'')+(isPct(m)?(diff*100).toFixed(1)+' pts':diff.toFixed(1))])}
  const EX={startups:[['runway','Median runway'],['survival','Survival'],['pmf','Median PMF']],decisions:[['payoff','Pay-off rate'],['raise','Raise close rate']],survey:[['ipo','Share choosing IPO'],['horizon','Avg horizon']]};
  EX[state.ds].filter(([key])=>key!==state.metric).forEach(([key,l])=>{const mm=DS[state.ds].metrics[key];k.push([l,fmt(mm,stat(sub,mm).v)])});
  const canFilter=DS[state.ds].filters.includes(state.group);
  $('drill').innerHTML=`<div class="row" style="justify-content:space-between"><b>${name}</b><span>${canFilter?`<button class="linkbtn" id="keep">Filter to this group</button> · `:''}<button class="linkbtn" id="close">Close</button></span></div>
    <div class="kpis">${k.map(([l,v])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>`;
  $('drill').classList.add('show');
  $('close').onclick=()=>$('drill').classList.remove('show');
  if(canFilter)$('keep').onclick=()=>{F[state.ds][state.group]=new Set([cat]);clearPreset();buildFilters();draw()};
}
function copyView(){
  if(!last)return;const{m,cats,series,d}=last;
  let t=$('title').textContent+'\n'+$('insight').innerText+'\n\n'+[d.dims[state.group],...series.map(s=>s.name)].join('\t')+'\n';
  cats.forEach((c,i)=>{t+=[c,...series.map(s=>fmt(m,s.stats[i].v))].join('\t')+'\n'});
  t+='\nSimulated data (seed 20261110).';
  navigator.clipboard.writeText(t).then(()=>{$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy view as text',1500)},()=>{$('copy').textContent='Copy not allowed here'});
}
</script>
